name: Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Cache for OCI CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.oci
            ~/.oracle-cli
          key: ${{ runner.os }}-oci-cli-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-oci-cli-

      - name: Install OCI CLI
        run: |
          curl -L -O https://githubusercontent.com
          chmod +x install.sh
          ./install.sh --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Run Test Launch
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=dummy_fingerprint_will_be_resolved_by_cli
          key_file=~/.oci/oci_api_key.pem
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          EOF
          
          echo "★自動連打テスト：オラクルへの接続を試みます..."
          # ここに実際の確保コマンドを追記、またはhitrovツールのコアをキックします
