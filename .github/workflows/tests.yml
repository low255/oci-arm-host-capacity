name: Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write OCI Config and Key
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          
          FINGERPRINT=$(openssl rsa -pubout -outform DER < ~/.oci/oci_api_key.pem 2>/dev/null | openssl md5 -c 2>/dev/null | awk '{print $2}')
          
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$FINGERPRINT
          key_file=~/.oci/oci_api_key.pem
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          EOF

      - name: Install OCI CLI Safely
        run: |
          sudo apt-get update -y && sudo apt-get install -y python3-pip
          pip3 install oci-cli --break-system-packages
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Launch Command
        env:
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ vars.OCI_SSH_PUBLIC_KEY }}
        run: |
          echo "★自動連打テスト：オラクルへの接続を試みます..."
          
          # SSH公開鍵を一時ファイルに保存
          echo "$OCI_SSH_PUBLIC_KEY" >  ~/ssh_key.pub
          
          # 自動的に一番最初のAD（データセンターのエリア）と、最新のUbuntu22.04イメージを取得して作成を申請します
          AD_NAME=$(~/.local/bin/oci iam availability-domain list --compartment-id "$OCI_COMPARTMENT_OCID" --query "data[0].name" --raw-output)
          IMAGE_ID=$(~/.local/bin/oci compute image list --compartment-id "$OCI_COMPARTMENT_OCID" --operating-system "Canonical Ubuntu" --operating-system-version "22.04" --shape "VM.Standard.A1.Flex" --query "data[0].id" --raw-output)
          
          ~/.local/bin/oci compute instance launch \
            --availability-domain "$AD_NAME" \
            --compartment-id "$OCI_COMPARTMENT_OCID" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":4,"memoryInGbs":24}' \
            --assign-public-ip true \
            --subnet-id "$OCI_SUBNET_OCID" \
            --image-id "$IMAGE_ID" \
            --ssh-authorized-keys-file ~/ssh_key.pub 2>&1
